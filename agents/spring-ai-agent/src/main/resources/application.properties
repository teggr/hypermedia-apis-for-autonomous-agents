spring.application.name=spring-ai-agent
server.port=8082

# OpenAI configuration — set via environment variable or application-local.properties
spring.ai.openai.api-key=${OPENAI_API_KEY:change-me}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Target API mode: "conventional" or "hypermedia"
agent.api.mode=hypermedia
agent.api.base-url.conventional=http://localhost:8080
agent.api.base-url.hypermedia=http://localhost:8081
