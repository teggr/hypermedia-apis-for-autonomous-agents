spring.application.name=hypermedia-api
server.port=8081

# Prefer HAL-FORMS over HAL for generic JSON requests so affordance templates are visible.
spring.hateoas.use-hal-as-default-json-media-type=false
spring.mvc.contentnegotiation.default-content-type=application/prs.hal-forms+json

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Actuator metrics + HTTP exchange tracing for Copilot-driven evaluation
management.endpoints.web.exposure.include=health,info,metrics,httpexchanges
management.endpoint.httpexchanges.enabled=true
management.httpexchanges.recording.enabled=true
